<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>quickbox — macOS app</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="kit.css?v=2">
</head>
<body>

<!-- macOS menubar (desktop context) -->
<div class="qb-menubar">
  <span class="qb-mb-apple">􀣺</span>
  <span class="qb-mb-item bold">Finder</span>
  <span class="qb-mb-item">File</span>
  <span class="qb-mb-item">Edit</span>
  <span class="qb-mb-item">View</span>
  <span class="qb-mb-item">Go</span>
  <span class="qb-mb-item">Window</span>
  <span class="qb-mb-item">Help</span>
  <div class="qb-mb-right">
    <span style="font-weight:600; letter-spacing:.3px;">QB</span>
    <span>􀋭</span>
    <span>􀋙</span>
    <img class="logo" src="../../assets/logo/quickbox-monogram.svg" alt="quickbox" onclick="document.getElementById('pop').classList.toggle('hidden')"/>
    <span class="time">Tue 21 Apr  15:45</span>
  </div>
</div>

<!-- Capture panel -->
<div class="qb-capture">
  <div class="qb-capture-top">
    <div class="pencil">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    </div>
    <input class="qb-capture-input" placeholder="Capture thought…" autofocus />
    <div class="box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
    </div>
  </div>
  <div class="qb-capture-hints">
    <span><b>@</b> project</span>
    <span><b>#</b> tag</span>
    <span><b>!</b> priority</span>
    <span><b>due:</b></span>
  </div>
</div>

<!-- Today -->
<div class="qb-today">
  <div class="qb-today-head">
    <div class="qb-today-nav">
      <button aria-label="Previous day">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 2 L3 5 l3.5 3"/></svg>
      </button>
      <span class="label">Today</span>
      <button aria-label="Next day">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 2 L7 5 l-3.5 3"/></svg>
      </button>
    </div>
    <div class="right">
      <button class="qb-chip-btn">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="5" cy="5" r="3.5"/><path d="M5 3 L5 5 L6.5 6"/></svg>
        Open only
      </button>
    </div>
  </div>
  <div class="qb-today-list">
    <div class="qb-today-row">
      <div class="check"></div>
      <div class="t">Ship Q3 report</div>
      <div class="meta">⌘1</div>
    </div>
    <div class="qb-today-row">
      <div class="check"></div>
      <div class="t">Review pricing doc</div>
      <div class="meta">⌘2</div>
    </div>
    <div class="qb-today-row done">
      <div class="check">
        <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="#18181B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5 l2 2 l4-5"/></svg>
      </div>
      <div class="t">Book dentist</div>
      <div class="meta">⌘3</div>
    </div>
  </div>
</div>

<!-- Menu-bar popover (settings / actions) -->
<div class="qb-popover" id="pop">
  <div class="hd">
    quickbox
    <span class="status"><span class="dot"></span>Ready · 3 today</span>
  </div>
  <div class="row-btns">
    <button>Open Today File</button>
    <button>Open Inbox Folder</button>
  </div>
  <div class="sep"></div>
  <div class="item">Capture… <span class="k">⌘⇧Space</span></div>
  <div class="item">Toggle Today <span class="k">⌘⇧T</span></div>
  <div class="sep"></div>
  <div class="item">Settings <span class="k">⌘,</span></div>
  <div class="item">Quit quickbox <span class="k">⌘Q</span></div>
</div>

</body>
</html>
