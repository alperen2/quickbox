<!doctype html>
<html><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;height:100%;background:var(--window-bg);font-family:var(--font-sans);}
 .wrap{display:flex;flex-direction:column;justify-content:center;padding:24px 28px;height:100%;box-sizing:border-box;gap:8px;}
 .huge{font-family:var(--font-display);font-size:56px;line-height:60px;font-weight:800;letter-spacing:-1px;color:var(--label);}
 .sub{font-family:var(--font-rounded);font-size:18px;font-weight:500;color:var(--label-secondary);}
 .tok{font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);}
</style></head><body>
<div class="wrap">
  <div class="huge">Drop it in.</div>
  <div class="sub">Onboarding uses SF Pro Rounded for warmth.</div>
  <div class="tok">display · 56/60 · 800 · Inter fallback</div>
</div></body></html>
