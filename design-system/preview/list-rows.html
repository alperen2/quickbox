<!doctype html>
<html><head><meta charset="utf-8"><title>List rows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;height:100%;background:#1c1c1e;font-family:var(--font-sans);color:rgba(255,255,255,.92);}
 .list{padding:8px;}
 .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13px;line-height:16px;color:rgba(255,255,255,.92);}
 .row + .row{margin-top:1px;}
 .row.sel{background:rgba(255,255,255,.10);}
 .title{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;}
 .title > span:first-child{color:rgba(255,255,255,.95);font-weight:500;}
 .sub{font-size:11px;color:rgba(255,255,255,.5);}
 .meta{color:rgba(255,255,255,.45);font-size:11px;font-family:var(--font-mono);}
 .check{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.25px rgba(255,255,255,.35);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
 .check.on{background:#fff;box-shadow:none;}
 .check svg{display:none;}
 .check.on svg{display:block;stroke:#18181B;}
 .done .title > span:first-child{text-decoration:line-through;color:rgba(255,255,255,.4);}
 .done .sub{color:rgba(255,255,255,.3);}
</style></head><body>
<div class="list">
  <div class="row"><span class="check"></span><span class="title"><span>Ship Q3 report</span><span class="sub">Due today</span></span><span class="meta">⌘1</span></div>
  <div class="row sel"><span class="check on"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5 l2 2 l4-5"/></svg></span><span class="title"><span>Review pricing doc</span><span class="sub">Work · 2:30 pm</span></span><span class="meta">⌘2</span></div>
  <div class="row done"><span class="check on"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5 l2 2 l4-5"/></svg></span><span class="title"><span>Book dentist</span><span class="sub">Personal</span></span><span class="meta">⌘3</span></div>
  <div class="row"><span class="check"></span><span class="title"><span>Reply to Sofia</span><span class="sub">Inbox</span></span><span class="meta">⌘4</span></div>
</div></body></html>
