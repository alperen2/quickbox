<!doctype html>
<html><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;background:var(--window-bg);font-family:var(--font-sans);color:var(--label);}
 .wrap{padding:18px 22px;display:flex;flex-direction:column;gap:6px;}
 .row{display:flex;align-items:baseline;gap:14px;}
 .row .tok{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);}
</style></head><body>
<div class="wrap">
  <div class="row"><span class="qb-largetitle">Large Title</span><span class="tok">26/32 · 700</span></div>
  <div class="row"><span class="qb-title1">Title 1</span><span class="tok">22/26 · 700</span></div>
  <div class="row"><span class="qb-title2">Title 2</span><span class="tok">17/22 · 600</span></div>
  <div class="row"><span class="qb-title3">Title 3</span><span class="tok">15/20 · 600</span></div>
  <div class="row"><span class="qb-headline">Headline</span><span class="tok">13/16 · 600</span></div>
  <div class="row"><span class="qb-body">Body — the quick brown fox</span><span class="tok">13/16 · 400</span></div>
  <div class="row"><span class="qb-callout">Callout</span><span class="tok">12/16 · 400</span></div>
  <div class="row"><span class="qb-subheadline">Subheadline</span><span class="tok">11/14 · 400</span></div>
  <div class="row"><span class="qb-footnote">Footnote</span><span class="tok">10/13 · 400</span></div>
  <div class="row"><span class="qb-caption2">Caption 2</span><span class="tok">10/13 · 700 CAPS</span></div>
</div></body></html>
