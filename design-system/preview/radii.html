<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;height:100%;background:var(--window-bg);font-family:var(--font-sans);}
 .wrap{display:flex;gap:14px;padding:20px;align-items:center;justify-content:center;height:100%;box-sizing:border-box;}
 .tile{width:72px;height:72px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.15),0 4px 12px rgba(0,0,0,.08);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);}
</style></head><body>
<div class="wrap">
  <div class="tile" style="border-radius:3px">3</div>
  <div class="tile" style="border-radius:6px">6</div>
  <div class="tile" style="border-radius:10px">10</div>
  <div class="tile" style="border-radius:16px">16</div>
  <div class="tile" style="border-radius:22px">22</div>
  <div class="tile" style="border-radius:26px">26</div>
  <div class="tile" style="border-radius:9999px">pill</div>
</div></body></html>
