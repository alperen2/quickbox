<!doctype html>
<html><head><meta charset="utf-8"><title>Fills</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;height:100%;background:var(--window-bg);font-family:var(--font-sans);}
 .wrap{display:flex;gap:10px;padding:20px;align-items:stretch;height:100%;box-sizing:border-box;}
 .sw{flex:1;border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);font-size:11px;}
 .sw b{font-weight:600;}
 .sw span{font-family:var(--font-mono);color:var(--label-tertiary);}
</style></head><body>
<div class="wrap">
  <div class="sw" style="background:rgba(0,0,0,.10)"><b>primary</b><span>10% α</span></div>
  <div class="sw" style="background:rgba(0,0,0,.08)"><b>secondary</b><span>8% α</span></div>
  <div class="sw" style="background:rgba(0,0,0,.05)"><b>tertiary</b><span>5% α</span></div>
  <div class="sw" style="background:rgba(0,0,0,.03)"><b>quaternary</b><span>3% α</span></div>
  <div class="sw" style="background:rgba(0,0,0,.02)"><b>quinary</b><span>2% α</span></div>
</div></body></html>
