<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%;background:var(--window-bg);}
  .wrap{display:flex;align-items:center;justify-content:center;gap:48px;height:100%;padding:24px;}
  .tile{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .tile small{color:var(--label-tertiary);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;}
</style></head><body>
<div class="wrap">
  <div class="tile"><img src="../assets/logo/quickbox-monogram.svg" width="72" height="72" alt=""><small>monogram</small></div>
  <div class="tile"><img src="../assets/logo/quickbox-wordmark.svg" height="56" alt=""><small>wordmark</small></div>
  <div class="tile" style="background:#0f0f10;padding:14px 20px;border-radius:12px;">
    <img src="../assets/logo/quickbox-wordmark.svg" height="44" alt="" style="filter:invert(1);">
  </div>
</div></body></html>
