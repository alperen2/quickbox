<!doctype html>
<html><head><meta charset="utf-8"><title>Materials</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;height:100%;font-family:var(--font-sans);overflow:hidden;}
 /* calm, realistic desktop-wallpaper stand-in — no rainbow */
 .bg{position:fixed;inset:0;background:
    radial-gradient(circle at 20% 30%, #3f3f46 0%, transparent 45%),
    radial-gradient(circle at 80% 70%, #52525b 0%, transparent 50%),
    #27272a;}
 .wrap{position:relative;display:flex;gap:12px;padding:20px;align-items:center;justify-content:center;height:100%;box-sizing:border-box;}
 .m{flex:1;max-width:150px;aspect-ratio:1.4/1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:rgba(255,255,255,.92);}
 .m b{font-size:12px;font-weight:600;letter-spacing:-.1px;}
 .m span{font-size:10px;opacity:.55;font-family:var(--font-mono);}
 .thin{background:rgba(255,255,255,.08);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14);}
 .reg{background:rgba(255,255,255,.14);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);}
 .thick{background:rgba(255,255,255,.22);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22);}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
  <div class="m thin"><b>Thin</b><span>blur 20</span></div>
  <div class="m reg"><b>Regular</b><span>blur 30</span></div>
  <div class="m thick"><b>Thick</b><span>blur 40</span></div>
</div></body></html>
