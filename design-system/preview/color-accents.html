<!doctype html>
<html><head><meta charset="utf-8"><title>System accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;height:100%;background:var(--window-bg);font-family:var(--font-sans);}
 .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:16px;height:100%;box-sizing:border-box;}
 .sw{border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:600;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15);}
</style></head><body>
<div class="grid">
  <div class="sw" style="background:var(--red)">Red</div>
  <div class="sw" style="background:var(--orange)">Orange</div>
  <div class="sw" style="background:var(--yellow);color:#3a2a00">Yellow</div>
  <div class="sw" style="background:var(--green)">Green</div>
  <div class="sw" style="background:var(--mint)">Mint</div>
  <div class="sw" style="background:var(--teal)">Teal</div>
  <div class="sw" style="background:var(--cyan)">Cyan</div>
  <div class="sw" style="background:var(--blue)">Blue</div>
  <div class="sw" style="background:var(--indigo)">Indigo</div>
  <div class="sw" style="background:var(--purple)">Purple</div>
  <div class="sw" style="background:var(--pink)">Pink</div>
  <div class="sw" style="background:var(--brown)">Brown</div>
  <div class="sw" style="background:var(--gray)">Gray</div>
  <div class="sw" style="background:#000">Black</div>
</div></body></html>
