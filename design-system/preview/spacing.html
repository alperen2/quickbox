<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;height:100%;background:var(--window-bg);font-family:var(--font-sans);}
 .wrap{padding:20px;display:flex;flex-direction:column;gap:4px;justify-content:center;height:100%;box-sizing:border-box;}
 .row{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--label-secondary);font-family:var(--font-mono);}
 .bar{background:var(--brand);height:10px;border-radius:3px;}
</style></head><body>
<div class="wrap">
  <div class="row"><span class="bar" style="width:2px"></span>--space-1 · 2</div>
  <div class="row"><span class="bar" style="width:4px"></span>--space-2 · 4</div>
  <div class="row"><span class="bar" style="width:8px"></span>--space-3 · 8</div>
  <div class="row"><span class="bar" style="width:12px"></span>--space-4 · 12</div>
  <div class="row"><span class="bar" style="width:16px"></span>--space-5 · 16</div>
  <div class="row"><span class="bar" style="width:24px"></span>--space-7 · 24</div>
  <div class="row"><span class="bar" style="width:32px"></span>--space-8 · 32</div>
  <div class="row"><span class="bar" style="width:48px"></span>--space-9 · 48</div>
  <div class="row"><span class="bar" style="width:64px"></span>--space-10 · 64</div>
</div></body></html>
