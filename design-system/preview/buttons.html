<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;height:100%;background:var(--window-bg);font-family:var(--font-sans);}
 .wrap{display:flex;flex-wrap:wrap;gap:10px;padding:20px;align-items:center;justify-content:center;height:100%;box-sizing:border-box;}
 .btn{font-family:var(--font-sans);font-size:13px;font-weight:500;height:24px;padding:0 12px;border-radius:6px;border:none;line-height:1;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
 .btn.primary{background:var(--blue);color:#fff;box-shadow:0 .5px 0 rgba(0,0,0,.2),inset 0 .5px 0 rgba(255,255,255,.3);}
 .btn.secondary{background:#fff;color:var(--label);box-shadow:0 0 0 .5px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.05);}
 .btn.borderless{background:transparent;color:var(--blue);}
 .btn.destructive{background:var(--red);color:#fff;}
 .btn.brand{background:var(--brand);color:#fff;box-shadow:0 .5px 0 rgba(0,0,0,.15),inset 0 .5px 0 rgba(255,255,255,.3);}
 .btn.disabled{color:var(--label-quaternary);background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08);}
</style></head><body>
<div class="wrap">
  <button class="btn primary">Send</button>
  <button class="btn brand">Create box</button>
  <button class="btn secondary">Cancel</button>
  <button class="btn destructive">Move to Trash</button>
  <button class="btn borderless">Open…</button>
  <button class="btn disabled">Send</button>
</div></body></html>
